name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_repository.py
      - run: python scripts/validate_chain_level_plan.py tests/fixtures/plans/valid-minimal.yaml
      - run: python scripts/validate_runtime_state.py tests/fixtures/runtime/valid-level-active.yaml
      - run: python scripts/validate_topology_fault.py tests/fixtures/topology-faults/valid-chain-local.yaml
      - run: >-
          python scripts/validate_receipt_chain.py
          chain-loop-skill/templates/d0-worker-receipt.yaml
          chain-loop-skill/templates/d1-checker-receipt.yaml
          chain-loop-skill/templates/d2-go-verification-receipt.yaml
      - run: python -m pytest -q
