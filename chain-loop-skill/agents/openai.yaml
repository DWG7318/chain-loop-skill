  default_prompt: "Use only $chain-loop-skill (CLK), exactly once. Preserve fixed persistent Chains, ordered Levels, full Barriers, immutable Receipts, Worker-owned rework, and fresh D2/LEVEL/D3 Verification. Freeze Calabash, the maximum valid Chain roster, versioned Required sets, DEVICE_CAPACITY_PROFILE, CUMULATIVE_ENGINEERING_LOAD, and dispatch only CELL_CAPACITY_GATE PASS work. Every active CELL_DISPATCH binds one current Worker/Checker/scope and complete T+0/T+2/T+4/T+6 wake lifecycle; only INITIAL_UNDISPATCHED may have no wake. Every unique D1 decision has exactly one bound Checker progress update, and every material trigger has exactly one Supervisor update. Create exactly one separate non-authoritative gpt-5.6-luna+xhigh Run patrol and heartbeat, mapping workload LOW→10/MEDIUM→15/HIGH→30 with fixed check/status/finding and observation/evidence identity. Keep canonical technical roles to Supervisor/Checker/Worker/Verification, treat GO/CELL/Round as subtasks and visible tasks as peer roles, and forbid spawned/delegated/hidden/background Agents. Deny set_thread_pinned in the technical-role matrix and patrol binding; only explicit Owner provenance legitimizes Pin. Preserve topology fault localization and never load, combine, borrow, or switch to SLK or GLK inside the Run."
