interface:
  display_name: "Chain Loop Skill (CLK)"
  short_description: "Fixed multi-Chain Runs with full Level barriers"
  default_prompt: "Use only $chain-loop-skill (CLK), exactly once. Preserve the canonical Chain Loop Skill identity and Level topology. Require a frozen Run Contract and Calabash baseline, at least two fixed persistent Chains, one open Level, all Level members launch-ready together, multiple ACTIVE GOs only across different Chains, and at most one ACTIVE GO per Chain. Use visible persistent Checker/Worker pairs, fresh isolated D2/LEVEL/D3 Verification attempts, strong immutable Receipt binding, full Level barriers, Worker-owned rework, and Owner-free routine autonomy. A Required GO needs D2 PASS; an Optional GO must reach a declared non-active terminal state before the Barrier. After D3 PASS facilitate immediate Run-product Owner Acceptance, then return LOOP_OWNER_ACCEPTED to LCCoding with project_security_closed false and delivery_authorized false. Never load, combine, borrow, or switch to SLK or GLK inside the Run."
